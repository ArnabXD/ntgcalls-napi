name: Standalone Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  setup-libs:
    name: Prepare Shared Libraries
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Resolve Latest Release
        id: get-version
        run: |
          TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/pytgcalls/ntgcalls/releases/latest | jq -r .tag_name)
          if [ "$TAG" = "null" ] || [ -z "$TAG" ]; then
            TAG="v2.1.0"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download & Unzip All Platform Libraries
        run: |
          TAG="${{ steps.get-version.outputs.tag }}"
          echo "Using libntgcalls release: $TAG"
          
          mkdir -p dl/linux-x64 dl/linux-arm64 dl/macos-arm64 dl/windows-x64
          
          # 1. Linux x64
          curl -L -o linux-x64.zip "https://github.com/pytgcalls/ntgcalls/releases/download/${TAG}/ntgcalls.linux-x86_64-shared_libs.zip"
          unzip -jo linux-x64.zip "*.so" -d dl/linux-x64/
          
          # 2. Linux ARM64
          curl -L -o linux-arm64.zip "https://github.com/pytgcalls/ntgcalls/releases/download/${TAG}/ntgcalls.linux-arm64-shared_libs.zip"
          unzip -jo linux-arm64.zip "*.so" -d dl/linux-arm64/
          
          # 3. macOS ARM64
          curl -L -o macos-arm64.zip "https://github.com/pytgcalls/ntgcalls/releases/download/${TAG}/ntgcalls.macos-arm64-shared_libs.zip"
          unzip -jo macos-arm64.zip "*.dylib" -d dl/macos-arm64/
          
          # 4. Windows x64
          curl -L -o windows-x64.zip "https://github.com/pytgcalls/ntgcalls/releases/download/${TAG}/ntgcalls.windows-x86_64-shared_libs.zip"
          unzip -jo windows-x64.zip "*.dll" "*.lib" -d dl/windows-x64/

      - name: Upload Linux x64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: libntgcalls-linux-x64
          path: dl/linux-x64/

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: libntgcalls-linux-arm64
          path: dl/linux-arm64/

      - name: Upload macOS ARM64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: libntgcalls-macos-arm64
          path: dl/macos-arm64/

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: libntgcalls-windows-x64
          path: dl/windows-x64/

  build-native:
    name: Build Native (${{ matrix.platform.name }})
    needs: [setup-libs]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-latest
            target: ""
            asset_suffix: linux-x64.node
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-arm64.node
          - name: macos-arm64
            os: macos-latest
            target: ""
            asset_suffix: macos-arm64.node
          - name: windows-x64
            os: windows-latest
            target: ""
            asset_suffix: windows-x64.node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build
        uses: swatinem/rust-cache@v2

      # ── Install Cross-Compilation Toolchain (if required) ───────────────────

      - name: Install cross-compilation toolchain (Linux ARM64)
        if: matrix.platform.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      # ── Download Pre-Extracted Shared Library Artifact ──────────────────────

      - name: Download Pre-Extracted Shared Library Artifact
        uses: actions/download-artifact@v7
        with:
          name: libntgcalls-${{ matrix.platform.name }}
          path: lib/

      # ── Build Native Addon ───────────────────────────────────────────────────

      - name: Install npm dependencies
        run: npm install

      - name: Compile C-bindings (Rust Addon)
        shell: bash
        run: |
          if [ "${{ matrix.platform.target }}" != "" ]; then
            cargo build --release --target ${{ matrix.platform.target }}
          else
            cargo build --release
          fi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Copy & Prepare Binary (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          if [ "${{ matrix.platform.name }}" = "linux-arm64" ]; then
            cp target/aarch64-unknown-linux-gnu/release/libntgcalls.so ./ntgcalls.${{ matrix.platform.asset_suffix }}
          elif [ "${{ matrix.platform.os }}" = "ubuntu-latest" ]; then
            cp target/release/libntgcalls.so ./ntgcalls.${{ matrix.platform.asset_suffix }}
          else
            cp target/release/libntgcalls.dylib ./ntgcalls.${{ matrix.platform.asset_suffix }}
          fi

      - name: Copy & Prepare Binary (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: powershell
        run: |
          cp target/release/ntgcalls.dll ./ntgcalls.${{ matrix.platform.asset_suffix }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ntgcalls-${{ matrix.platform.name }}
          path: ntgcalls.${{ matrix.platform.asset_suffix }}

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-native]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all built binaries
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ntgcalls.linux-x64.node
            ntgcalls.linux-arm64.node
            ntgcalls.macos-arm64.node
            ntgcalls.windows-x64.node
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
