name: Standalone Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  setup-libs:
    name: Prepare Shared Libraries
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Resolve Latest Release
        id: get-version
        run: |
          TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/pytgcalls/ntgcalls/releases/latest | jq -r .tag_name)
          if [ "$TAG" = "null" ] || [ -z "$TAG" ]; then
            TAG="v2.1.0"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download & Unzip All Platform Libraries
        run: |
          TAG="${{ steps.get-version.outputs.tag }}"
          echo "Using libntgcalls release: $TAG"

          mkdir -p dl/linux-x64 dl/linux-arm64 dl/macos-arm64 dl/windows-x64

          curl -L -o linux-x64.zip "https://github.com/pytgcalls/ntgcalls/releases/download/${TAG}/ntgcalls.linux-x86_64-shared_libs.zip"
          unzip -jo linux-x64.zip "*.so" -d dl/linux-x64/

          curl -L -o linux-arm64.zip "https://github.com/pytgcalls/ntgcalls/releases/download/${TAG}/ntgcalls.linux-arm64-shared_libs.zip"
          unzip -jo linux-arm64.zip "*.so" -d dl/linux-arm64/

          curl -L -o macos-arm64.zip "https://github.com/pytgcalls/ntgcalls/releases/download/${TAG}/ntgcalls.macos-arm64-shared_libs.zip"
          unzip -jo macos-arm64.zip "*.dylib" -d dl/macos-arm64/

          curl -L -o windows-x64.zip "https://github.com/pytgcalls/ntgcalls/releases/download/${TAG}/ntgcalls.windows-x86_64-shared_libs.zip"
          unzip -jo windows-x64.zip "*.dll" "*.lib" -d dl/windows-x64/

      - uses: actions/upload-artifact@v7
        with:
          name: libntgcalls-linux-x64
          path: dl/linux-x64/

      - uses: actions/upload-artifact@v7
        with:
          name: libntgcalls-linux-arm64
          path: dl/linux-arm64/

      - uses: actions/upload-artifact@v7
        with:
          name: libntgcalls-macos-arm64
          path: dl/macos-arm64/

      - uses: actions/upload-artifact@v7
        with:
          name: libntgcalls-windows-x64
          path: dl/windows-x64/

  build-native:
    name: Build Native (${{ matrix.platform.name }})
    needs: [setup-libs]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-latest
            target: ""
            lib_ext: so
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib_ext: so
          - name: macos-arm64
            os: macos-latest
            target: ""
            lib_ext: dylib
          - name: windows-x64
            os: windows-latest
            target: ""
            lib_ext: dll

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build
        uses: swatinem/rust-cache@v2

      - name: Install cross-compilation toolchain (Linux ARM64)
        if: matrix.platform.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Download Pre-Extracted Shared Library Artifact
        uses: actions/download-artifact@v8
        with:
          name: libntgcalls-${{ matrix.platform.name }}
          path: lib/

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: Compile Rust Addon
        shell: bash
        run: |
          if [ "${{ matrix.platform.target }}" != "" ]; then
            cargo build --release --target ${{ matrix.platform.target }}
          else
            cargo build --release
          fi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binary (Unix)
        if: matrix.platform.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist/lib

          if [ "${{ matrix.platform.name }}" = "linux-arm64" ]; then
            cp target/aarch64-unknown-linux-gnu/release/libntgcalls.so dist/ntgcalls.node
          elif [ "${{ matrix.platform.os }}" = "ubuntu-latest" ]; then
            cp target/release/libntgcalls.so dist/ntgcalls.node
          else
            cp target/release/libntgcalls.dylib dist/ntgcalls.node
          fi

          cp lib/*.${{ matrix.platform.lib_ext }} dist/lib/
          cd dist && zip -r ../ntgcalls-napi.${{ matrix.platform.name }}.zip ntgcalls.node lib/

      - name: Package binary (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\lib
          Copy-Item target\release\ntgcalls.dll dist\ntgcalls.node
          Copy-Item lib\*.${{ matrix.platform.lib_ext }} dist\lib\
          Compress-Archive -Force -Path dist\ntgcalls.node, dist\lib -DestinationPath ntgcalls-napi.${{ matrix.platform.name }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ntgcalls-napi-${{ matrix.platform.name }}
          path: ntgcalls-napi.${{ matrix.platform.name }}.zip

  publish-release:
    name: Publish Release & npm
    runs-on: ubuntu-latest
    needs: [build-native]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # Node 24 bundles npm >= 11.5.1, required for trusted publishing (OIDC)
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate Changelog for this Tag
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --current --strip header --ignore-tags '.*-beta.*'
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release & Attach Zips
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ntgcalls-napi.linux-x64.zip
            ntgcalls-napi.linux-arm64.zip
            ntgcalls-napi.macos-arm64.zip
            ntgcalls-napi.windows-x64.zip
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | cut -d'-' -f2 | sed -E 's/[\.-]?[0-9]+$//')
            if [ -z "$TAG" ]; then TAG="next"; fi
            echo "Prerelease version detected ($VERSION). Publishing with tag: $TAG"
            npm publish --access public --ignore-scripts --tag "$TAG"
          else
            echo "Stable version detected ($VERSION). Publishing with default tag"
            npm publish --access public --ignore-scripts
          fi